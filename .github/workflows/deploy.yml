name: Build and deploy Record Atlas

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: npm ci || npm install
        working-directory: site
      - name: Build
        run: npm run build
        working-directory: site
      # WHAT THE SITE ACTUALLY WEIGHS, MEASURED WHERE IT IS CLEAN.
      # Every size decision on this project has been made against a local
      # dist/ that accumulates: it held 71,093 files from earlier builds and
      # read 1,215 MB, which is where "985 MB of 1,024" came from and why the
      # 16,138 surname pages were refused as unaffordable. The deployed
      # artifact was 158 MB the whole time. CI builds from nothing every run,
      # so this is the only number worth trusting.
      - name: What it weighs
        run: |
          echo "raw dist:  $(du -sm site/dist | cut -f1) MB"
          echo "files:     $(find site/dist -type f | wc -l)"
          echo "GitHub Pages publishes at most 1,024 MB."
          echo "--- the heaviest directories:"
          du -sm site/dist/* | sort -rn | head -12
          echo "--- pages by kind:"
          for d in place surname country archive p s rs g; do
            [ -d "site/dist/$d" ] && \
              echo "  $d: $(find site/dist/$d -type f | wc -l) files, $(du -sm site/dist/$d | cut -f1) MB"
          done

      # THE AUDIT, ON EVERY BUILD RATHER THAN WHEN SOMEBODY REMEMBERS.
      # It checks internal links, payload validity, coordinates, duplicate
      # ids, volume date sanity, archive coordinates against the gazetteer,
      # and the showcase cards against the surname data. Today it caught
      # three archives that were nowhere near the towns they are named
      # after, and it only ran because I ran it by hand.
      # Reporting, not blocking, for now: it is new, and a false positive
      # here would stop David's site deploying. It should be made blocking
      # once it has been green for a while.
      - name: Audit
        run: python3 scripts/audit-site.py || echo "::warning::audit reported problems — see above"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
