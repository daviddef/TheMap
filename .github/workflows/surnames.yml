name: Surname registers

# THE LOOKUP-ONLY COUNTRIES GO STALE IN A WAY A CORPUS DOES NOT.
#
# Most registers in data/frequencies/ are a table somebody published: the
# harvester takes it whole and re-running it changes nothing until the
# statistics office publishes again. Croatia is different and is the reason
# this exists. The DZS has no surname table — only a 2011 census lookup that
# answers one name at a time — so the atlas can ask only about names it
# already believes are Croatian. That list GROWS: every matcher pass places
# more Croatian volumes and finds names this lookup would never think to ask
# about, and nothing was asking them.
#
# WHY THIS DOES NOT COMMIT. The link-rot job next door opens an issue rather
# than pushing, deliberately, and the same argument holds harder here: these
# are answers from a government service about people's names, and they should
# land in the repository because somebody looked at them, not because a cron
# job had a quiet Monday. The results come back as an artifact and an issue.
#
# WHY THE CACHE IS RESTORED. data/.croatia-surnames-scan.json is gitignored —
# correctly, it is scan bookkeeping — so a CI run starts blind and would
# re-ask every name it has ever asked, every week, at a government form. The
# cache action is what makes the run incremental, and HR_MAX is the belt to
# its braces: even with no cache at all, one run asks at most forty questions
# and the backlog drains over a few weeks.
on:
  schedule:
    - cron: "41 5 * * 3"     # Wednesday, early, and off the hour
  workflow_dispatch:
    inputs:
      max:
        description: "Most DZS questions to ask in this run (0 = no ceiling)"
        default: "40"

permissions:
  contents: read
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      # Keyed by run number so each run restores the newest previous state;
      # restore-keys walks back to whatever is there. Losing it is survivable
      # — HR_MAX means it costs politeness, not correctness.
      - name: Restore what has already been asked
        uses: actions/cache@v4
        with:
          path: data/.croatia-surnames-scan.json
          key: hr-surname-scan-${{ github.run_number }}
          restore-keys: hr-surname-scan-

      - name: Ask DZS about the Croatian names added since
        id: hr
        env:
          HR_MAX: ${{ github.event.inputs.max || '40' }}
          HR_PAUSE: "2.0"
        run: |
          set +e
          python3 scripts/harvest-croatia-surnames.py | tee hr.txt
          echo "code=$?" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Refetch the Belgian register
        id: be
        run: |
          set +e
          python3 scripts/harvest-belgium-surnames.py | tee be.txt
          echo "code=$?" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: What changed
        id: diff
        run: |
          git diff --stat -- data/frequencies data/belgium-by-municipality.json > changed.txt || true
          if [ -s changed.txt ]; then echo "any=yes" >> "$GITHUB_OUTPUT";
          else echo "any=no" >> "$GITHUB_OUTPUT"; fi
          cat changed.txt

      - name: Say so, without committing
        if: steps.diff.outputs.any == 'yes'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const read = (f) => { try { return fs.readFileSync(f, 'utf8').trim(); }
                                  catch { return '(nothing)'; } };
            const body = [
              'The weekly register refresh found new answers. **Nothing has been',
              'committed** — these are answers about people\'s names from national',
              'services, and they should land because somebody looked at them.',
              '',
              'Download the `registers` artifact from this run, or re-run locally:',
              '',
              '```',
              'python3 scripts/harvest-croatia-surnames.py   # incremental, cached',
              'python3 scripts/harvest-belgium-surnames.py',
              'python3 scripts/build-surnames.py && python3 scripts/build.py',
              '```',
              '',
              '**Croatia** — the DZS lookup, one name at a time:',
              '```', read('hr.txt').split('\n').slice(-25).join('\n'), '```',
              '',
              '**Belgium** — Statbel, refetched whole:',
              '```', read('be.txt').split('\n').slice(-15).join('\n'), '```',
              '',
              '**Files that moved:**',
              '```', read('changed.txt'), '```',
            ].join('\n');
            const title = 'Surname registers: new answers to fold in';
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'registers',
            });
            const existing = open.data.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['registers'],
              });
            }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: registers
          path: |
            data/frequencies/hr.json
            data/belgium-by-municipality.json
            data/.croatia-surnames-scan.json
            hr.txt
            be.txt
