<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Record Atlas">
  <!-- The house mark. A rounded square with a letter, to sit in a tab strip
       beside the Mazza, Lerena and Booyzen archives without looking like a
       stranger. Teal is this atlas's own accent token, #1F5C6B, so the
       favicon and the map agree.
       The R is drawn rather than set in a font: a favicon rendered at 16px
       through whatever font a machine happens to have is a different mark on
       every computer, and a house mark that changes is not one. -->
  <rect width="64" height="64" rx="14" fill="#1F5C6B"/>
  <g fill="#F2EFE6">
    <!-- R: stem, bowl, leg -->
    <rect x="18" y="14" width="7.5" height="36" rx="1.5"/>
    <path d="M25.5 14h11a10.5 10.5 0 0 1 0 21h-11v-6.5h10.5a4 4 0 0 0 0-8H25.5z"/>
    <path d="M33.5 33.5h8.2L49 50h-8.4z"/>
  </g>
</svg>
